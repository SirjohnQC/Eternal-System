name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking: must be green to merge.
  check:
    name: Typecheck, build & invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npx vite build
      - name: Seeded simulation invariants
        run: npm run test:invariants

  # Full-system 400k-tick run (~4 min). Blocking.
  smoke:
    name: Smoke test (400k ticks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - name: Tech cards (every card played in a seeded world, ~40 s)
        run: npm run test:techcards
      - name: Great moments and leader voices (~2 min)
        run: npm run test:moments
      - name: Ages that press (~2 min)
        run: npm run test:pace
      - name: Rulers who live (~1.5 min)
        run: npm run test:council
