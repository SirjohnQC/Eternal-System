name: Release

# Push a tag like v0.2.0 (matching package.json) to publish a release:
# tests, production build, and a GitHub Release with the playable build
# attached and notes generated from the merged PRs. See docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"
            exit 1
          fi

      - name: Tests
        run: npm test
      - name: Smoke test
        run: npm run test:smoke

      - name: Build
        run: npx vite build
      - name: Package
        run: cd dist && zip -qr "../eternal-system-${GITHUB_REF_NAME}.zip" .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "eternal-system-${GITHUB_REF_NAME}.zip" \
            --title "Eternal System ${GITHUB_REF_NAME}" --generate-notes $pre
