<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Planet Engine - Master Build</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020104;
      color: #c9c1e3;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #viewport-container {
      position: relative;
      width: 480px;
      height: 640px;
      border: 2px solid #2d1e45;
      border-radius: 6px;
      box-shadow: 0 0 70px rgba(0, 0, 0, 0.98), 0 0 30px rgba(75, 45, 130, 0.3);
      background: #030206;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hud {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(8, 6, 15, 0.94);
      border: 1px solid #4a366b;
      padding: 10px 14px;
      border-radius: 4px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      backdrop-filter: blur(8px);
      font-size: 11px;
    }
    .group { display: flex; align-items: center; gap: 6px; }
    button, select {
      background: #191129;
      color: #a8caef;
      border: 1px solid #573f7d;
      padding: 5px 9px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 3px;
    }
    button:hover, select:hover { background: #321f52; border-color: #8b68c9; }
    .badge {
      font-size: 9px;
      color: #7b6a9e;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PLANETS = {
      vacuum: {
        name: 'Ocean (No Ozone)',
        hasAtmo: false,
        atmoThickness: 0,
        waterLevel: 0.82,
        isMagma: false,
        waterColors: { deep: [22, 45, 80], mid: [42, 88, 142], light: [80, 145, 205], glint: [155, 205, 240] },
        terrain: { beach: [170, 130, 85], land: [120, 80, 55], peak: [180, 120, 80], cliff: [70, 45, 30] },
        rockLit: [195, 130, 80],
        rockShadow: [40, 26, 32],
        settlementType: 'dome',
        faunaType: 'none',
        propType: 'crater',
        hasClouds: false,
        rainColor: [180, 220, 255]
      },
      terra: {
        name: 'Terra Continents',
        hasAtmo: true,
        atmoThickness: 16,
        atmoColor: [65, 165, 255],
        waterLevel: 0.46,
        isMagma: false,
        waterColors: { deep: [18, 48, 88], mid: [35, 95, 160], light: [70, 150, 220], glint: [170, 220, 255] },
        terrain: { beach: [215, 200, 145], land: [52, 125, 60], peak: [235, 242, 250], cliff: [55, 65, 50] },
        rockLit: [140, 130, 110],
        rockShadow: [30, 35, 30],
        settlementType: 'village',
        faunaType: 'deer',
        propType: 'tree',
        hasClouds: true,
        cloudColor: [240, 246, 255],
        cloudShadow: [160, 172, 195],
        rainColor: [140, 205, 255]
      },
      infernal: {
        name: 'Infernal Core',
        hasAtmo: true,
        atmoThickness: 18,
        atmoColor: [255, 75, 20],
        waterLevel: 0.42,
        isMagma: true,
        waterColors: { deep: [130, 20, 5], mid: [210, 65, 10], light: [255, 140, 20], glint: [255, 240, 160] },
        terrain: { beach: [70, 55, 60], land: [42, 32, 38], peak: [22, 16, 20], cliff: [25, 18, 22] },
        rockLit: [85, 70, 75],
        rockShadow: [25, 20, 24],
        settlementType: 'fortress',
        faunaType: 'strider',
        propType: 'spire',
        hasClouds: true,
        cloudColor: [75, 60, 65],
        cloudShadow: [38, 28, 32],
        rainColor: [255, 120, 30]
      },
      toxic: {
        name: 'Toxic Xenon',
        hasAtmo: true,
        atmoThickness: 17,
        atmoColor: [80, 240, 110],
        waterLevel: 0.50,
        isMagma: false,
        waterColors: { deep: [15, 60, 50], mid: [20, 130, 95], light: [45, 200, 140], glint: [180, 255, 210] },
        terrain: { beach: [80, 45, 100], land: [125, 65, 150], peak: [200, 120, 230], cliff: [50, 25, 65] },
        rockLit: [110, 70, 135],
        rockShadow: [35, 18, 45],
        settlementType: 'biodome',
        faunaType: 'hopper',
        propType: 'crystal',
        hasClouds: true,
        cloudColor: [215, 240, 135],
        cloudShadow: [135, 160, 75],
        rainColor: [100, 255, 160]
      },
      cryo: {
        name: 'Cryo Glaciers',
        hasAtmo: true,
        atmoThickness: 12,
        atmoColor: [135, 185, 255],
        waterLevel: 0.44,
        isMagma: false,
        waterColors: { deep: [25, 50, 90], mid: [45, 90, 150], light: [90, 155, 215], glint: [190, 230, 255] },
        terrain: { beach: [175, 210, 240], land: [225, 240, 255], peak: [255, 255, 255], cliff: [90, 120, 150] },
        rockLit: [100, 125, 150],
        rockShadow: [28, 36, 48],
        settlementType: 'outpost',
        faunaType: 'penguin',
        propType: 'snowtree',
        hasClouds: true,
        cloudColor: [230, 240, 255],
        cloudShadow: [160, 180, 210],
        rainColor: [255, 255, 255]
      }
    };

    class PRNG {
      constructor(seed) { this.s = seed % 2147483647; if (this.s <= 0) this.s += 2147483646; }
      next() { return (this.s = (this.s * 16807) % 2147483647) / 2147483647; }
    }

    class DioramaEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d', { willReadFrequently: true });
        this.w = 160;
        this.h = 240;
        canvas.width = this.w;
        canvas.height = this.h;
        this.imgData = this.ctx.createImageData(this.w, this.h);
        this.buf = new Uint32Array(this.imgData.data.buffer);

        this.time = 0;
        this.seed = 31415;
        this.planetKey = 'terra';
        this.weatherMode = 'default';
        this.speedMultiplier = 0.5;
        this.showLife = true;

        this.stars = [];
        this.clouds = [];
        this.raindrops = [];
        this.splashes = [];
        this.meteors = [];
        this.solarParticles = [];
        this.ridgeNoise = [];
        this.terrainMap = new Float32Array(this.w * this.h);
        this.settlements = [];
        this.props = [];
        this.critters = [];
        this.birds = [];
        this.magmaBubbles = [];

        this.initStars();
        this.rebuild(this.planetKey, this.seed);
      }

      initStars() {
        const prng = new PRNG(101);
        for (let i = 0; i < 90; i++) {
          this.stars.push({
            x: Math.floor(prng.next() * this.w),
            y: Math.floor(prng.next() * this.h),
            isCross: prng.next() > 0.9,
            pulseOffset: prng.next() * 10
          });
        }
      }

      noise2D(x, y, s) {
        const n = Math.sin(x * 12.9898 + y * 78.233 + s) * 43758.5453;
        return n - Math.floor(n);
      }

      smoothNoise(x, y, seed) {
        const i = Math.floor(x), j = Math.floor(y);
        const fx = x - i, fy = y - j;
        const s = fx * fx * (3 - 2 * fx), t = fy * fy * (3 - 2 * fy);
        const n00 = this.noise2D(i, j, seed), n10 = this.noise2D(i + 1, j, seed);
        const n01 = this.noise2D(i, j + 1, seed), n11 = this.noise2D(i + 1, j + 1, seed);
        return (n00 * (1 - s) + n10 * s) * (1 - t) + (n01 * (1 - s) + n11 * s) * t;
      }

      rebuild(planetKey, seed) {
        this.planetKey = planetKey;
        this.seed = seed;
        const prng = new PRNG(seed);
        const cfg = PLANETS[planetKey];

        // 1. Jagged Seabed Noise
        this.ridgeNoise = [];
        for (let x = 0; x < this.w; x++) {
          this.ridgeNoise[x] = Math.sin(x * 0.12) * 5 + Math.cos(x * 0.28 + prng.next() * 3) * 4 + (prng.next() > 0.82 ? prng.next() * 7 : 0);
        }

        // 2. Plateau Elevation Map
        for (let y = 0; y < this.h; y++) {
          for (let x = 0; x < this.w; x++) {
            const e1 = this.smoothNoise(x * 0.045, y * 0.045, seed);
            const e2 = this.smoothNoise(x * 0.11, y * 0.11, seed + 42) * 0.4;
            this.terrainMap[y * this.w + x] = (e1 + e2) / 1.4;
          }
        }

        // 3. Scan Plateau Candidates
        const cx = 80, ocY = 92, rx = 58, ry = 30;
        const lowlandSpots = [];
        const highlandSpots = [];
        for (let py = Math.floor(ocY - ry + 4); py <= Math.ceil(ocY + ry - 4); py++) {
          for (let px = Math.floor(cx - rx + 6); px <= Math.ceil(cx + rx - 6); px++) {
            const nx = (px - cx) / rx, ny = (py - ocY) / ry;
            if (nx * nx + ny * ny < 0.78) {
              const elev = this.terrainMap[py * this.w + px];
              if (elev > cfg.waterLevel + 0.04 && elev < cfg.waterLevel + 0.18) {
                lowlandSpots.push({ x: px, y: py, elev });
              } else if (elev >= cfg.waterLevel + 0.18) {
                highlandSpots.push({ x: px, y: py, elev });
              }
            }
          }
        }

        // 4. Build Settlements
        this.settlements = [];
        if (lowlandSpots.length > 0) {
          const count = cfg.settlementType === 'dome' ? 1 : Math.min(2, Math.floor(lowlandSpots.length / 20));
          for (let c = 0; c < count; c++) {
            const spot = lowlandSpots[Math.floor(prng.next() * lowlandSpots.length)];
            this.settlements.push({
              x: spot.x,
              y: spot.y,
              type: cfg.settlementType,
              windowPulse: prng.next() * 10
            });
          }
        }

        // 5. Place Flora & Terrain Props (Trees, Spires, Crystals)
        this.props = [];
        const propPool = [...lowlandSpots, ...highlandSpots];
        for (let i = 0; i < Math.min(12, propPool.length); i++) {
          if (prng.next() > 0.4) {
            const spot = propPool[Math.floor(prng.next() * propPool.length)];
            this.props.push({
              x: spot.x,
              y: spot.y,
              elev: spot.elev,
              type: cfg.propType
            });
          }
        }

        // 6. Ground Critters
        this.critters = [];
        if (cfg.faunaType !== 'none' && lowlandSpots.length > 0) {
          for (let i = 0; i < 3; i++) {
            const spot = lowlandSpots[Math.floor(prng.next() * lowlandSpots.length)];
            this.critters.push({
              x: spot.x,
              y: spot.y,
              homeX: spot.x,
              homeY: spot.y,
              type: cfg.faunaType,
              timer: prng.next() * 5
            });
          }
        }

        // 7. Flying Aerial Species
        this.birds = [];
        if (cfg.hasAtmo && cfg.faunaType !== 'none') {
          for (let b = 0; b < 4; b++) {
            this.birds.push({
              angle: prng.next() * Math.PI * 2,
              radius: 18 + prng.next() * 26,
              speed: 0.015 + prng.next() * 0.01,
              wingPhase: prng.next() * 5
            });
          }
        }

        // 8. Clouds
        this.clouds = [];
        if (cfg.hasClouds) {
          this.clouds.push(
            { x: 50, y: 54, w: 28, h: 8, speed: 0.07 },
            { x: 85, y: 44, w: 34, h: 9, speed: 0.05 },
            { x: 105, y: 62, w: 22, h: 7, speed: 0.06 }
          );
        }

        this.magmaBubbles = [];
        this.raindrops = [];
        this.splashes = [];
        this.meteors = [];
        this.solarParticles = [];
      }

      setPixel(x, y, r, g, b, a = 255) {
        if (x < 0 || x >= this.w || y < 0 || y >= this.h) return;
        this.buf[y * this.w + x] = (a << 24) | (b << 16) | (g << 8) | r;
      }

      blendPixel(x, y, r, g, b, alphaRatio) {
        if (x < 0 || x >= this.w || y < 0 || y >= this.h) return;
        const idx = y * this.w + x;
        const old = this.buf[idx];
        const oldR = old & 0xff, oldG = (old >> 8) & 0xff, oldB = (old >> 16) & 0xff;
        const newR = Math.floor(oldR + (r - oldR) * alphaRatio);
        const newG = Math.floor(oldG + (g - oldG) * alphaRatio);
        const newB = Math.floor(oldB + (b - oldB) * alphaRatio);
        this.buf[idx] = (255 << 24) | (newB << 16) | (newG << 8) | newR;
      }

      render() {
        this.time += 0.009 * this.speedMultiplier;

        const planet = PLANETS[this.planetKey];
        const cx = 80, cy = 135, R = 64;
        const bob = Math.sin(this.time * 0.7) * 1.5;
        const ocY = 92 + bob, rx = 58, ry = 30, wallDepth = 22;

        // 1. Deep Space
        for (let i = 0; i < this.w * this.h; i++) this.buf[i] = 0xff060204;

        // 2. Stars
        for (const s of this.stars) {
          const lum = (Math.sin(this.time * 0.8 + s.pulseOffset) + 1) * 0.5;
          const a = Math.floor(70 + lum * 180);
          this.setPixel(s.x, s.y, 190, 210, 255, a);
          if (s.isCross && lum > 0.7) {
            this.setPixel(s.x + 1, s.y, 190, 210, 255, a / 2);
            this.setPixel(s.x - 1, s.y, 190, 210, 255, a / 2);
            this.setPixel(s.x, s.y + 1, 190, 210, 255, a / 2);
            this.setPixel(s.x, s.y - 1, 190, 210, 255, a / 2);
          }
        }

        // 3. Cosmic Weather: Meteors & Solar Wind Streams
        this.updateCosmicWeather();

        // 4. Luminous Atmosphere Shell
        const atmoR = planet.hasAtmo ? R + planet.atmoThickness : R;
        if (planet.hasAtmo) {
          for (let y = Math.floor(cy + bob - atmoR); y <= Math.ceil(cy + bob + atmoR); y++) {
            for (let x = Math.floor(cx - atmoR); x <= Math.ceil(cx + atmoR); x++) {
              const dx = x - cx, dy = y - (cy + bob);
              const d = Math.sqrt(dx * dx + dy * dy);
              if (d > R && d <= atmoR) {
                const falloff = Math.pow(1.0 - (d - R) / planet.atmoThickness, 1.6);
                const sunFacing = dx / atmoR;
                const glowIntensity = falloff * (sunFacing > -0.1 ? 0.85 : 0.28);
                this.blendPixel(x, y, planet.atmoColor[0], planet.atmoColor[1], planet.atmoColor[2], glowIntensity);
              }
            }
          }
        }

        // 5. Planet Sphere Silhouette & Crust
        for (let y = 0; y < this.h; y++) {
          for (let x = 0; x < this.w; x++) {
            const dx = x - cx, dy = y - (cy + bob);
            const distSq = dx * dx + dy * dy;
            if (distSq <= R * R) {
              const nz = Math.sqrt(Math.max(0, R * R - distSq)) / R;
              const nx = dx / R, ny = dy / R;
              const light = nx * 0.65 - ny * 0.25 + nz * 0.65;

              if (Math.abs(dx) <= rx && y < ocY + ry * 0.28) continue;

              const isRight = nx > 0.05;
              let [cr, cg, cb] = isRight
                ? planet.rockLit.map(v => Math.min(255, Math.floor(v * Math.max(0, light + 0.3))))
                : planet.rockShadow.map(v => Math.min(255, Math.floor(v * Math.max(0.1, light + 0.2))));

              if (((x ^ y) & 5) === 0) { cr *= 0.88; cg *= 0.88; cb *= 0.88; }
              this.setPixel(x, y, Math.floor(cr), Math.floor(cg), Math.floor(cb));

              if (planet.hasAtmo && distSq > (R - 5) * (R - 5)) {
                this.blendPixel(x, y, planet.atmoColor[0], planet.atmoColor[1], planet.atmoColor[2], 0.22);
              }
            }
          }
        }

        // 6. Jagged Seabed Mountain Ridge
        for (let x = cx - rx + 4; x <= cx + rx - 4; x++) {
          const normX = (x - cx) / rx;
          const frontCurveY = ocY + Math.sqrt(Math.max(0, 1 - normX * normX)) * ry;
          const ridge = this.ridgeNoise[x] || 0;
          const baseY = frontCurveY + wallDepth + ridge;
          for (let y = Math.floor(frontCurveY + 12); y <= baseY + 6; y++) {
            const dy = y - (cy + bob), dx = x - cx;
            if (dx * dx + dy * dy <= R * R) {
              const s = normX > -0.1 ? 1.0 : 0.45;
              this.setPixel(x, y, Math.floor(planet.rockLit[0] * s), Math.floor(planet.rockLit[1] * s), Math.floor(planet.rockLit[2] * s));
            }
          }
        }

        // 7. Front Sheer Cutaway Wall
        for (let x = cx - rx; x <= cx + rx; x++) {
          const normX = (x - cx) / rx;
          const frontCurveY = ocY + Math.sqrt(Math.max(0, 1 - normX * normX)) * ry;
          const ridge = this.ridgeNoise[x] || 0;
          const bottomY = frontCurveY + wallDepth + ridge;
          const elevAtEdge = this.terrainMap[Math.floor(frontCurveY) * this.w + x] || 0;
          const isLandCliff = elevAtEdge > planet.waterLevel;
          const facetShade = (Math.floor((x - (cx - rx)) / 14) % 2 === 0) ? 1.0 : 0.86;

          for (let y = Math.floor(frontCurveY); y <= bottomY; y++) {
            const depthRatio = (y - frontCurveY) / wallDepth;
            if (isLandCliff) {
              const stripe = (y % 4 < 2) ? 0.85 : 1.1;
              this.setPixel(x, y,
                Math.floor(planet.terrain.cliff[0] * depthRatio * stripe),
                Math.floor(planet.terrain.cliff[1] * depthRatio * stripe),
                Math.floor(planet.terrain.cliff[2] * depthRatio * stripe)
              );
            } else if (planet.isMagma) {
              const r = Math.floor(220 - depthRatio * 100);
              const g = Math.floor(70 - depthRatio * 45);
              const b = 15;
              this.setPixel(x, y, r, g, b);
            } else {
              const r = Math.floor((planet.waterColors.deep[0] + depthRatio * 15) * facetShade);
              const g = Math.floor((planet.waterColors.deep[1] + depthRatio * 20) * facetShade);
              const b = Math.floor((planet.waterColors.deep[2] + depthRatio * 35) * facetShade);
              this.setPixel(x, y, r, g, b);
              if (x % 14 === 0) this.setPixel(x, y, r + 15, g + 25, b + 40);
            }
          }
        }

        // 8. Top Plateau: 3D Height Extrusions & Dynamic Fluids
        for (let py = Math.floor(ocY - ry); py <= Math.ceil(ocY + ry); py++) {
          for (let px = Math.floor(cx - rx); px <= Math.ceil(cx + rx); px++) {
            const nx = (px - cx) / rx, ny = (py - ocY) / ry;
            const distFromCenter = nx * nx + ny * ny;

            if (distFromCenter <= 1.0) {
              const elev = this.terrainMap[py * this.w + px];

              if (elev <= planet.waterLevel) {
                if (planet.isMagma) {
                  // VISCOUS MAGMA SIMULATION
                  const flow = Math.sin(px * 0.08 + this.time * 0.4) + Math.cos(py * 0.12 - this.time * 0.3);
                  const fissure = Math.abs(flow);
                  if (fissure < 0.22) {
                    this.setPixel(px, py, 255, 220, 110);
                  } else if (fissure < 0.5) {
                    this.setPixel(px, py, 245, 90, 15);
                  } else {
                    this.setPixel(px, py, 50, 24, 28);
                  }
                } else {
                  // OCEAN WATER WAVES
                  const wave = Math.sin(distFromCenter * 12 - this.time * 1.8) + Math.cos(px * 0.12 + py * 0.1 + this.time * 0.8) * 0.4;
                  let [r, g, b] = planet.waterColors.mid;
                  if (wave > 0.65) [r, g, b] = planet.waterColors.glint;
                  else if (wave > 0.2) [r, g, b] = planet.waterColors.light;
                  else if (wave < -0.55) [r, g, b] = planet.waterColors.deep;
                  if (distFromCenter > 0.94) { r += 45; g += 45; b += 55; }
                  this.setPixel(px, py, r, g, b);
                }
              } else {
                // 3D TERRAIN CONTINENTS WITH SHADED FACES
                const heightTier = elev > 0.72 ? 3 : (elev > 0.58 ? 2 : 1);
                const lift = heightTier === 3 ? 6 : (heightTier === 2 ? 3 : 1);

                let [tr, tg, tb] = heightTier === 3
                  ? planet.terrain.peak
                  : (heightTier === 2 ? planet.terrain.land : planet.terrain.beach);

                if (nx > 0.05) { tr += 18; tg += 18; tb += 18; }
                this.setPixel(px, py - lift, tr, tg, tb);

                for (let c = 1; c <= lift; c++) {
                  const cliffCol = planet.terrain.cliff;
                  this.setPixel(px, py - lift + c, cliffCol[0], cliffCol[1], cliffCol[2]);
                }
              }
            }
          }
        }

        // 9. Subsurface Leviathan (Swims Beneath Translucent Water)
        if (this.showLife && !planet.isMagma) {
          const creatureAngle = this.time * 0.35;
          for (let seg = 0; seg < 6; seg++) {
            const lagAngle = creatureAngle - seg * 0.14;
            const sx = Math.floor(cx + Math.cos(lagAngle) * (rx * 0.52));
            const sy = Math.floor(ocY + Math.sin(lagAngle) * (ry * 0.52));
            if (this.terrainMap[sy * this.w + sx] <= planet.waterLevel) {
              this.setPixel(sx, sy, planet.waterColors.deep[0] / 2, planet.waterColors.deep[1] / 2, planet.waterColors.deep[2] / 2);
              this.setPixel(sx + 1, sy, planet.waterColors.glint[0], planet.waterColors.glint[1], planet.waterColors.glint[2]);
            }
          }
        }

        // 10. Magma Bubbles & Bursting Sparks
        if (planet.isMagma) {
          if (Math.random() < 0.08) {
            const angle = Math.random() * Math.PI * 2, dist = Math.random() * 0.7;
            this.magmaBubbles.push({
              x: cx + Math.cos(angle) * (rx * dist),
              y: ocY + Math.sin(angle) * (ry * dist),
              life: 1.0, decay: 0.03
            });
          }
          for (let b = this.magmaBubbles.length - 1; b >= 0; b--) {
            const bub = this.magmaBubbles[b];
            bub.life -= bub.decay;
            if (bub.life <= 0) { this.magmaBubbles.splice(b, 1); continue; }
            const bx = Math.floor(bub.x), by = Math.floor(bub.y);
            this.setPixel(bx, by, 255, 240, 180);
            if (bub.life > 0.4) {
              this.setPixel(bx + 1, by, 255, 120, 20);
              this.setPixel(bx - 1, by, 255, 120, 20);
            }
          }
        }

        // 11. Flora & Surface Props (Trees, Spires, Crystals)
        for (const p of this.props) {
          const heightTier = p.elev > 0.72 ? 3 : (p.elev > 0.58 ? 2 : 1);
          const lift = heightTier === 3 ? 6 : (heightTier === 2 ? 3 : 1);
          const px = Math.floor(p.x);
          const py = Math.floor(p.y - lift + bob);

          if (p.type === 'tree') {
            this.setPixel(px, py - 1, 46, 110, 64);
            this.setPixel(px, py - 2, 70, 150, 85);
            this.setPixel(px, py, 75, 45, 30);
          } else if (p.type === 'snowtree') {
            this.setPixel(px, py - 1, 120, 155, 175);
            this.setPixel(px, py - 2, 245, 250, 255);
            this.setPixel(px, py, 45, 55, 65);
          } else if (p.type === 'spire') {
            this.setPixel(px, py - 1, 30, 20, 25);
            this.setPixel(px, py - 2, 255, 90, 20);
          } else if (p.type === 'crystal') {
            this.setPixel(px, py - 1, 80, 240, 210);
            this.setPixel(px, py - 2, 160, 255, 240);
          }
        }

        // 12. Visual Settlements
        for (const s of this.settlements) {
          const sx = Math.floor(s.x);
          const sy = Math.floor(s.y - 3 + bob);
          const windowOn = Math.sin(this.time * 2 + s.windowPulse) > -0.2;

          if (s.type === 'village') {
            this.setPixel(sx - 1, sy, 210, 195, 180);
            this.setPixel(sx, sy, 210, 195, 180);
            this.setPixel(sx - 1, sy - 1, 185, 75, 55);
            this.setPixel(sx, sy - 1, 185, 75, 55);
            if (windowOn) this.setPixel(sx, sy, 255, 215, 90);
            this.setPixel(sx + 2, sy + 1, 140, 95, 60); // harbor pier
          } else if (s.type === 'fortress') {
            this.setPixel(sx, sy, 35, 28, 30);
            this.setPixel(sx, sy - 1, 20, 15, 18);
            this.setPixel(sx, sy - 2, 20, 15, 18);
            if (windowOn) this.setPixel(sx, sy - 1, 255, 80, 20);
          } else if (s.type === 'biodome') {
            this.setPixel(sx - 1, sy, 40, 180, 160);
            this.setPixel(sx, sy, 60, 240, 210);
            this.setPixel(sx + 1, sy, 40, 180, 160);
            this.setPixel(sx, sy - 1, 120, 255, 230);
          } else if (s.type === 'dome') {
            this.setPixel(sx - 1, sy, 190, 200, 210);
            this.setPixel(sx, sy, 220, 230, 240);
            this.setPixel(sx + 1, sy, 190, 200, 210);
            this.setPixel(sx, sy - 1, 240, 250, 255);
            if (windowOn) this.setPixel(sx, sy, 80, 180, 255);
          }
        }

        // 13. Ground Fauna & Flying Birds
        if (this.showLife) {
          for (const critter of this.critters) {
            critter.timer += 0.02 * this.speedMultiplier;
            if (Math.sin(critter.timer) > 0.8) {
              critter.x += (Math.random() - 0.5) * 0.4;
              critter.y += (Math.random() - 0.5) * 0.3;
            }
            const cxp = Math.floor(critter.x), cyp = Math.floor(critter.y - 2 + bob);
            if (critter.type === 'deer') {
              this.setPixel(cxp, cyp, 175, 120, 80);
              this.setPixel(cxp, cyp - 1, 140, 90, 55);
            } else if (critter.type === 'strider') {
              this.setPixel(cxp, cyp, 255, 100, 30);
            } else if (critter.type === 'penguin') {
              this.setPixel(cxp, cyp, 220, 230, 240);
              this.setPixel(cxp, cyp - 1, 20, 25, 35);
            }
          }

          for (const bird of this.birds) {
            bird.angle += bird.speed * this.speedMultiplier;
            const bx = Math.floor(cx + Math.cos(bird.angle) * bird.radius);
            const by = Math.floor(ocY - 8 + Math.sin(bird.angle) * (bird.radius * 0.4) + bob);
            const wingUp = Math.sin(this.time * 6 + bird.wingPhase) > 0;
            this.setPixel(bx, by, 30, 35, 45);
            this.setPixel(bx - 1, wingUp ? by - 1 : by, 45, 50, 65);
            this.setPixel(bx + 1, wingUp ? by - 1 : by, 45, 50, 65);
          }
        }

        // 14. Clouds (Strictly Masked to Atmosphere)
        const activeWeather = this.weatherMode === 'default' ? (planet.hasClouds ? 'rain' : 'mist') : this.weatherMode;
        if (planet.hasClouds && activeWeather !== 'clear') {
          for (const c of this.clouds) {
            c.x += c.speed * this.speedMultiplier;
            if (c.x > cx + atmoR - 4) c.x = cx - atmoR + 4;
            const baseCloudY = c.y + bob * 0.5;

            for (let cy = 0; cy < c.h; cy++) {
              const rowW = c.w * Math.sin((cy / c.h) * Math.PI);
              for (let cxRel = -rowW / 2; cxRel < rowW / 2; cxRel++) {
                const px = Math.floor(c.x + cxRel), py = Math.floor(baseCloudY + cy);
                const distToPlanet = Math.sqrt((px - cx) ** 2 + (py - (cy + bob)) ** 2);
                if (distToPlanet <= atmoR - 1) {
                  const fade = Math.min(1.0, (atmoR - distToPlanet) / 3.0);
                  const isBottom = cy > c.h * 0.55;
                  const col = isBottom ? planet.cloudShadow : planet.cloudColor;
                  this.blendPixel(px, py, col[0], col[1], col[2], fade * 0.92);
                }
              }
            }

            // Spawn Rain Droplet from cloud base
            if (Math.random() < 0.22) {
              const spawnX = Math.floor(c.x + (Math.random() - 0.5) * (c.w * 0.8));
              const normX = (spawnX - cx) / rx;
              if (Math.abs(normX) < 0.95) {
                const maxRangeY = Math.sqrt(1 - normX * normX) * ry;
                const targetY = ocY + (Math.random() * 2 - 1) * maxRangeY;
                this.raindrops.push({
                  x: spawnX,
                  y: baseCloudY + c.h,
                  targetY: targetY,
                  speed: 1.1 + Math.random() * 0.5,
                  color: planet.rainColor
                });
              }
            }
          }
        }

        // 15. Vacuum Sublimation Mist (Boiling ocean edge on No Ozone planet)
        if (!planet.hasAtmo && (activeWeather === 'mist' || activeWeather === 'default')) {
          if (Math.random() < 0.16) {
            const angle = Math.random() * Math.PI * 2;
            const px = cx + Math.cos(angle) * (rx * 0.92);
            const py = ocY + Math.sin(angle) * (ry * 0.92);
            this.splashes.push({
              x: px, y: py,
              life: 1.0, decay: 0.02,
              type: 'mist',
              vx: Math.cos(angle) * 0.15,
              vy: -0.28
            });
          }
        }

        // 16. Rain Droplet Physics & Sticky Surface Collision
        for (let i = this.raindrops.length - 1; i >= 0; i--) {
          const drop = this.raindrops[i];
          drop.y += drop.speed * this.speedMultiplier;
          this.setPixel(Math.floor(drop.x), Math.floor(drop.y), drop.color[0], drop.color[1], drop.color[2]);
          this.setPixel(Math.floor(drop.x), Math.floor(drop.y) - 1, drop.color[0], drop.color[1], drop.color[2], 120);

          if (drop.y >= drop.targetY) {
            this.raindrops.splice(i, 1);
            const mapIdx = Math.floor(drop.targetY) * this.w + Math.floor(drop.x);
            const isLandImpact = (this.terrainMap[mapIdx] || 0) > planet.waterLevel;

            this.splashes.push({
              x: drop.x,
              relY: drop.targetY - bob,
              life: 1.0,
              decay: isLandImpact ? 0.025 : 0.035,
              color: drop.color,
              isLand: isLandImpact,
              type: planet.isMagma ? 'cinder' : (this.planetKey === 'cryo' ? 'snow' : 'ripple')
            });
          }
        }

        // 17. Render Splashes & Sticking Particles
        for (let i = this.splashes.length - 1; i >= 0; i--) {
          const sp = this.splashes[i];
          sp.life -= sp.decay * this.speedMultiplier;
          if (sp.life <= 0) { this.splashes.splice(i, 1); continue; }

          const sy = Math.floor(sp.relY + bob), sx = Math.floor(sp.x);
          const alpha = Math.floor(sp.life * 255);

          if (sp.type === 'cinder') {
            this.setPixel(sx, sy, 255, 230, 80, alpha);
          } else if (sp.type === 'snow') {
            this.setPixel(sx, sy, 245, 250, 255, alpha);
          } else if (sp.type === 'mist') {
            sp.x += sp.vx;
            sp.y += sp.vy;
            this.setPixel(Math.floor(sp.x), Math.floor(sp.y), 190, 220, 255, Math.floor(sp.life * 170));
          } else if (sp.type === 'ripple') {
            if (sp.isLand) {
              this.setPixel(sx, sy, Math.floor(sp.color[0] * 0.65), Math.floor(sp.color[1] * 0.65), Math.floor(sp.color[2] * 0.65), alpha);
            } else {
              const step = Math.floor((1.0 - sp.life) * 4);
              if (step <= 1) {
                this.setPixel(sx, sy, 255, 255, 255, alpha);
              } else {
                this.setPixel(sx - step, sy, sp.color[0], sp.color[1], sp.color[2], alpha / 2);
                this.setPixel(sx + step, sy, sp.color[0], sp.color[1], sp.color[2], alpha / 2);
              }
            }
          }
        }

        this.ctx.putImageData(this.imgData, 0, 0);
      }

      updateCosmicWeather() {
        // Meteors
        if (this.weatherMode === 'meteors' || Math.random() < 0.008) {
          if (Math.random() < 0.12) {
            this.meteors.push({
              x: 30 + Math.random() * (this.w - 20),
              y: -8,
              len: 8 + Math.random() * 10,
              speed: 4.5 + Math.random() * 2
            });
          }
        }

        for (let i = this.meteors.length - 1; i >= 0; i--) {
          const m = this.meteors[i];
          m.x -= m.speed * 0.5;
          m.y += m.speed;
          for (let l = 0; l < m.len; l++) {
            const mx = Math.floor(m.x + l * 0.5);
            const my = Math.floor(m.y - l);
            const fade = Math.floor(255 * (1 - l / m.len));
            this.setPixel(mx, my, 255, 235, 190, fade);
          }
          if (m.y > this.h || m.x < 0) this.meteors.splice(i, 1);
        }

        // Solar Wind Streams
        if (this.weatherMode === 'solar_wind') {
          if (Math.random() < 0.35) {
            this.solarParticles.push({
              x: Math.random() * this.w,
              y: -4,
              vx: -0.6,
              vy: 1.8 + Math.random(),
              life: 1.0, decay: 0.02
            });
          }
          for (let i = this.solarParticles.length - 1; i >= 0; i--) {
            const sp = this.solarParticles[i];
            sp.x += sp.vx;
            sp.y += sp.vy;
            sp.life -= sp.decay;
            if (sp.life <= 0) { this.solarParticles.splice(i, 1); continue; }
            this.setPixel(Math.floor(sp.x), Math.floor(sp.y), 110, 240, 200, Math.floor(sp.life * 230));
          }
        }
      }
    }

    // --- REACT HUD ---
    function App() {
      const canvasRef = useRef(null);
      const engineRef = useRef(null);
      const [planetKey, setPlanetKey] = useState('terra');
      const [weather, setWeather] = useState('default');
      const [speed, setSpeed] = useState('normal');
      const [showLife, setShowLife] = useState(true);
      const [seed, setSeed] = useState(31415);

      useEffect(() => {
        if (!canvasRef.current) return;
        const engine = new DioramaEngine(canvasRef.current);
        engineRef.current = engine;

        let animId;
        const loop = () => {
          engine.render();
          animId = requestAnimationFrame(loop);
        };
        loop();
        return () => cancelAnimationFrame(animId);
      }, []);

      useEffect(() => {
        if (engineRef.current) engineRef.current.rebuild(planetKey, seed);
      }, [planetKey, seed]);

      useEffect(() => {
        if (engineRef.current) engineRef.current.weatherMode = weather;
      }, [weather]);

      useEffect(() => {
        if (engineRef.current) engineRef.current.showLife = showLife;
      }, [showLife]);

      useEffect(() => {
        if (engineRef.current) {
          engineRef.current.speedMultiplier = speed === 'slow' ? 0.3 : (speed === 'normal' ? 0.6 : 1.0);
        }
      }, [speed]);

      return (
        <div id="viewport-container">
          <canvas ref={canvasRef} />
          <div className="hud">
            <div className="group">
              <span className="badge">PLANET:</span>
              <select value={planetKey} onChange={e => setPlanetKey(e.target.value)}>
                <option value="terra">Terra Continents (Village & Ozone)</option>
                <option value="infernal">Infernal Core (Magma & Fort)</option>
                <option value="vacuum">Ocean (No Ozone / Vacuum Dome)</option>
                <option value="toxic">Toxic Xenon (Bio-Dome & Acid)</option>
                <option value="cryo">Cryo Glaciers (Outpost & Snow)</option>
              </select>
            </div>

            <div className="group">
              <span className="badge">WEATHER:</span>
              <select value={weather} onChange={e => setWeather(e.target.value)}>
                <option value="default">Biome Default</option>
                <option value="rain">Precipitation</option>
                <option value="meteors">Meteor Shower</option>
                <option value="solar_wind">Solar Wind</option>
                <option value="clear">Clear Skies</option>
              </select>
            </div>

            <div className="group">
              <button onClick={() => setShowLife(!showLife)}>
                {showLife ? '🐋 Life: ON' : '🐋 Life: OFF'}
              </button>
              <select value={speed} onChange={e => setSpeed(e.target.value)}>
                <option value="slow">Slow</option>
                <option value="normal">Normal</option>
                <option value="brisk">Brisk</option>
              </select>
              <button onClick={() => setSeed(Math.floor(Math.random() * 99999))}>
                🎲 Seed
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
