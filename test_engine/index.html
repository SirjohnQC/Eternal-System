<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eternal System — Diorama Engine Test</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#090b10;color:#d9dee8;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}
  #ui{position:fixed;z-index:5;left:14px;top:14px;width:285px;background:rgba(12,15,22,.92);border:1px solid #303747;border-radius:10px;padding:14px;box-shadow:0 12px 40px #0008}
  h1{font-size:16px;margin:0 0 4px} p{font-size:11px;color:#8f98a8;margin:0 0 12px}
  .row{margin:9px 0}.row label{display:flex;justify-content:space-between;font-size:11px}.row input{width:100%}
  button{background:#1d2430;color:#e8edf5;border:1px solid #3b4657;border-radius:6px;padding:7px 9px;cursor:pointer;margin:3px}
  button:hover{background:#293344}.buttons{margin-top:10px}
  #legend{position:fixed;right:14px;top:14px;background:#0c0f16dd;border:1px solid #303747;border-radius:10px;padding:10px;font-size:10px;z-index:5}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
</style>
</head>
<body>
<div id="ui">
<h1>ETERNAL SYSTEM — DIORAMA LAB</h1>
<p>Procedural prototype. Change the planet state and watch the world react.</p>
<div class="row"><label>Population <span id="popv"></span></label><input id="pop" type="range" min="0" max="100" value="35"></div>
<div class="row"><label>Technology <span id="techv"></span></label><input id="tech" type="range" min="0" max="100" value="25"></div>
<div class="row"><label>Pollution <span id="pollv"></span></label><input id="poll" type="range" min="0" max="100" value="12"></div>
<div class="row"><label>Temperature <span id="tempv"></span></label><input id="temp" type="range" min="-50" max="50" value="5"></div>
<div class="row"><label>Humidity <span id="humv"></span></label><input id="hum" type="range" min="0" max="100" value="58"></div>
<div class="row"><label>Ocean Coverage <span id="oceanv"></span></label><input id="ocean" type="range" min="0" max="100" value="62"></div>
<div class="row"><label>Geological Activity <span id="geov"></span></label><input id="geo" type="range" min="0" max="100" value="15"></div>
<div class="buttons">
<button onclick="preset('primitive')">Primitive</button>
<button onclick="preset('industrial')">Industrial</button>
<button onclick="preset('utopia')">Green Future</button>
<button onclick="preset('hell')">Harsh World</button>
<button onclick="regen()">New Planet</button>
</div>
</div>
<div id="legend">LIVE SYSTEMS<br>☁ clouds · ~ ocean · ▲ terrain · ■ settlement · ● wildlife<br>Smoke, storms, vegetation, lights and volcanoes are simulation-driven.</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let seed=Math.random()*999999, t=0, events=[];
const ids=['pop','tech','poll','temp','hum','ocean','geo'];
function val(id){return +document.getElementById(id).value}
function rnd(n){let q=Math.sin(n*12.9898+seed)*43758.5453;return q-Math.floor(q)}
function noise(a,b=0){return (Math.sin(a*1.71+b*3.13+seed)*.5+.5)}
function terrain(px,py){
  let n=0;
  for(let i=1;i<6;i++) n+=noise(px*i*.018,py*i*.018)*(.52/i);
  return n/1.14;
}
function state(){
  let s={pop:val('pop'),tech:val('tech'),poll:val('poll'),temp:val('temp'),hum:val('hum'),ocean:val('ocean'),geo:val('geo')};
  s.veg=Math.max(0,Math.min(100,s.hum*.72-(Math.abs(s.temp-12)*.8)-s.poll*.55));
  s.cloud=Math.max(0,Math.min(100,s.hum*.72+s.ocean*.25+s.temp*.1));
  s.storm=Math.max(0,Math.min(100,s.hum*.55+s.ocean*.3+Math.abs(s.temp)*.25));
  s.city=Math.min(100,s.pop*(.35+s.tech/140));
  return s;
}
function label(id,out){document.getElementById(id+'v').textContent=out}
function sync(){
 ids.forEach(id=>label(id, id==='temp'?val(id)+'°':Math.round(val(id))));
}
ids.forEach(id=>document.getElementById(id).oninput=sync); sync();

function preset(p){
 let a={primitive:[8,4,1,8,65,55,8],industrial:[72,55,68,18,62,58,18],utopia:[76,82,8,10,65,61,10],hell:[28,48,82,42,28,34,88]}[p];
 ids.forEach((id,i)=>document.getElementById(id).value=a[i]); sync(); seed=Math.random()*999999;
}
function regen(){seed=Math.random()*999999}

function circle(px,py,r,fill,stroke){
 x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.stroke()}
}
function draw(){
 t+=.012; let S=state(), W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
 x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); W=innerWidth;H=innerHeight;
 x.fillStyle='#080b12';x.fillRect(0,0,W,H);
 let cx=W*.58,cy=H*.55,R=Math.min(W,H)*.39;
 // atmosphere halo
 circle(cx,cy,R+12,'rgba(80,130,180,.08)');
 // planet base
 let grad=x.createRadialGradient(cx-R*.3,cy-R*.35,R*.05,cx,cy,R);
 grad.addColorStop(0,'#607e54');grad.addColorStop(.55,'#344f3b');grad.addColorStop(1,'#111b1b');
 circle(cx,cy,R,grad);
 x.save();x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.clip();
 // terrain/ocean cells
 let step=Math.max(7,Math.floor(R/45));
 for(let py=cy-R;py<cy+R;py+=step) for(let px=cx-R;px<cx+R;px+=step){
   let dx=px-cx,dy=py-cy,edge=(dx*dx+dy*dy)/(R*R); if(edge>1) continue;
   let n=terrain(px-cx,py-cy);
   let ocean=n < S.ocean/150;
   let deep=ocean && n < S.ocean/220;
   if(ocean){
     x.fillStyle=deep?'#102f42':'#205d72';
     x.globalAlpha=.82;
     x.fillRect(px,py,step+1,step+1);
   } else {
     let dry=Math.max(0,Math.min(1,(S.temp+20)/70));
     let veg=S.veg/100;
     x.fillStyle=veg>.45?(n>.72?'#68754a':'#3e633e'):(dry>.6?'#806f45':'#5b624b');
     x.globalAlpha=.8;x.fillRect(px,py,step+1,step+1);
   }
 }
 x.globalAlpha=1;
 // vegetation clusters
 let vegCount=Math.floor(S.veg*2.2);
 for(let i=0;i<vegCount;i++){
   let a=rnd(i*7)*Math.PI*2, rr=Math.sqrt(rnd(i*9))*R*.86;
   let px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr*.72;
   if(terrain(px-cx,py-cy)<S.ocean/150) continue;
   let h=4+rnd(i*17)*10;
   x.fillStyle=S.poll>55?'#4d4a35':'#294b31';
   x.fillRect(px,py-h,h/3,h);
   x.fillRect(px-h*.5,py-h*.7,h,h*.35);
 }
 // settlements
 let count=Math.floor(S.city/5);
 for(let i=0;i<count;i++){
   let a=rnd(i*31+3)*Math.PI*2,rr=Math.sqrt(rnd(i*37+8))*R*.72;
   let px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr*.65;
   if(terrain(px-cx,py-cy)<S.ocean/150) continue;
   let size=3+S.tech/28;
   x.fillStyle=S.tech>65?'#9ba5ad':'#75685b';
   x.fillRect(px-size/2,py-size,size,size);
   if(S.tech>45){x.fillRect(px+size,py-size*1.5,2,size*1.5);x.fillRect(px-size*1.7,py-size*.8,2,size*.8)}
   if(S.tech>72){x.fillStyle='#cbd7a0';x.fillRect(px-1,py-size-2,2,2)}
 }
 // roads
 if(S.city>30){
   x.strokeStyle='rgba(174,154,115,.42)';x.lineWidth=1;
   for(let i=0;i<5;i++){let a=rnd(i+100)*Math.PI; x.beginPath();x.moveTo(cx+Math.cos(a)*R*.05,cy+Math.sin(a)*R*.05);x.lineTo(cx+Math.cos(a)*R*.75,cy+Math.sin(a)*R*.55);x.stroke()}
 }
 // volcanoes
 let volcanos=Math.floor(S.geo/28);
 for(let i=0;i<volcanos;i++){
   let a=rnd(i*53+9)*Math.PI*2,rr=Math.sqrt(rnd(i*19+2))*R*.7,px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr*.65;
   x.fillStyle='#27201c';x.beginPath();x.moveTo(px-9,py+6);x.lineTo(px,py-13);x.lineTo(px+10,py+6);x.fill();
   if(S.geo>65){x.fillStyle='#ff7a28';x.fillRect(px-1,py-3,2,10);circle(px,py-16,3,'#ff9b38')}
 }
 // pollution
 if(S.poll>10){
   let haze=Math.min(.52,S.poll/190);
   x.fillStyle=`rgba(82,82,75,${haze})`;x.fillRect(cx-R,cy-R,cx+R-(cx-R),R*2);
   for(let i=0;i<Math.floor(S.poll/5);i++){
     let px=cx+(rnd(i*11+77)*2-1)*R,py=cy+(rnd(i*13+21)*2-1)*R*.7;
     circle(px,py,2+rnd(i)*5,'rgba(75,75,70,.35)');
   }
 }
 // weather fronts
 if(S.storm>35){
   let clouds=Math.floor(S.cloud/4);
   for(let i=0;i<clouds;i++){
     let px=cx-R+(i*R*2/clouds)+(t*20%(R*2)),py=cy-R*.55+Math.sin(i*2+t)*R*.18;
     circle(((px-cx+R*2)%(R*2))+cx-R,py,10+rnd(i)*15,'rgba(220,226,226,.18)');
   }
 }
 // night side / city lights
 let night=(Math.sin(t*.15)*.5+.5);
 if(S.tech>30){
   x.fillStyle=`rgba(255,220,130,${night*.12})`;
   for(let i=0;i<Math.floor(S.city/2);i++){
     let a=rnd(i*43+4)*Math.PI*2,rr=Math.sqrt(rnd(i*61+4))*R*.7,px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr*.65;
     circle(px,py,1.2,'rgba(255,220,120,.8)');
   }
 }
 // animated ships
 if(S.ocean>35) for(let i=0;i<4;i++){
   let px=cx-R*.7+((t*(18+i*7)+i*R*.5)%(R*1.4)), py=cy-R*.15+i*R*.14;
   circle(px,py,1.5,'#d7e2df');
 }
 // wildlife
 if(S.veg>35) for(let i=0;i<8;i++){
   let px=cx+(rnd(i*90)*2-1)*R*.75,py=cy+(rnd(i*91)*2-1)*R*.5;
   x.fillStyle='#d5c987';x.fillRect(px,py,2,2);
 }
 x.restore();
 // rim
 x.strokeStyle='rgba(140,190,220,.42)';x.lineWidth=2; x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke();
 // labels
 x.font='12px system-ui';x.fillStyle='#aeb8c8';
 x.fillText('PLANETARY DIORAMA / LIVE SIMULATION',W-315,H-18);
 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
