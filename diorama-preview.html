<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Diorama Preview</title>
  <style>
    html,body{margin:0;background:#05060f;color:#c9c4e0;font:12px/1.4 monospace;}
    #bar{padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    #bar button,#bar input{background:#141428;color:#ddd;border:1px solid #33335a;padding:4px 8px;font:inherit;}
    #stage{width:100vw;height:calc(100vh - 44px);position:relative;}
    #fps{margin-left:auto;}
  </style>
</head>
<body>
  <div id="bar">
    <span>type:</span>
    <button data-t="ocean">ocean</button>
    <button data-t="rocky">rocky</button>
    <button data-t="ice">ice</button>
    <button data-t="lava">lava</button>
    <button data-t="gas">gas</button>
    <button data-t="toxic">toxic</button>
    <button data-t="crystal">crystal</button>
    <button data-t="desert">desert</button>
    <button data-t="storm">storm</button>
    <button data-t="carbon">carbon</button>
    <span>seed:</span><input id="seed" value="1" size="6" />
    <button id="reroll">reroll</button>
    <label><input type="checkbox" id="civ" checked /> civ</label>
    <span id="fps">--</span>
  </div>
  <div id="stage"></div>
  <script type="module" src="/src/dev/dioramaPreview.ts"></script>
</body>
</html>
